<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>作文批改结果（测试）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/public/js/echarts.min.js"></script>
  <style>
    :root { --bg:#f7f8fa; --card:#ffffff; --text:#1f2d3d; --muted:#6b7280; --accent:#4f46e5; --accent-2:#14b8a6; --accent-3:#ef4444; --border:#e5e7eb; --good:#10b981; }
    html,body { background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', system-ui, -apple-system, 'Segoe UI', Roboto; }
    .page { max-width: 1440px; margin: 24px auto; padding: 0 16px; }
    .header { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(79,70,229,.2); }
    .title { font-size: 28px; font-weight: 700; letter-spacing: .5px; }
    .meta { margin-top: 8px; display:flex; gap:16px; flex-wrap:wrap; }
    .meta-item { background: rgba(255,255,255,.15); padding: 6px 10px; border-radius: 999px; font-size: 13px; }
    .actions { display:flex; gap:10px; margin-top: 14px; }
    .btn { appearance:none; border:1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.15); color:#fff; border-radius: 999px; padding:10px 14px; font-size:14px; cursor:pointer; }
    .btn:hover { background: rgba(255,255,255,.25); }
    .grid { display:grid; grid-template-columns: 1.2fr 1.25fr 0.9fr; gap: 24px; margin-top: 20px; }
    .card { background: var(--card); border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.06); border:1px solid var(--border); }
    .card h3 { margin: 0; padding: 16px 20px; font-size: 18px; border-bottom:1px solid var(--border); }
    .card-body { padding: 18px 20px; }
    .orig { line-height: 1.85; font-size: 18px; font-family: 'Noto Serif SC', serif; }
    .orig .title-main { text-align: center; font-size: 22px; font-weight: 700; margin: 4px 0 6px; }
    .orig .title-sub { text-align: center; font-size: 16px; color: var(--muted); margin: 0 0 10px; }
    .orig p { margin: 0 0 10px; text-indent: 2em; }
    .score { display:flex; align-items:center; gap:12px; }
    .score-number { font-size: 40px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-3)); border-radius: 12px; padding: 8px 14px; }
    .score-badge { font-size: 13px; color: var(--muted); }
    .chart { width: 100%; height: 300px; }
    .dims { display:grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
    .dim-item { border:1px solid var(--border); border-radius: 12px; padding: 12px; overflow: hidden; }
    .dim-hd { display:flex; justify-content: space-between; font-weight: 600; }
    .dim-score { color: var(--good); }
    .dim-reason { margin-top: 6px; color: var(--text); line-height: 1.75; border-left: 4px solid transparent; padding: 8px 10px; border-radius: 8px; }
    .section { margin-top: 16px; }
    .section h4 { margin: 0 0 8px; font-size: 16px; }
    .overall { background:#fff7ed; border:1px solid #fde68a; border-radius: 12px; padding: 12px; color:#1d4ed8; }
    .suggest { display:grid; gap:8px; list-style: none; padding-left: 0; margin-left: 0; }
    .suggest li { background:#f0f9ff; border:1px solid #dbeafe; padding:10px 12px; border-radius: 10px; color:#059669; }
    .mark-wrong { border:2px solid #ef4444; border-radius: 999px; padding:0 6px; color:#ef4444; }
    .mark-good { color:#10b981; font-weight: 600; }
    .mark-bad { color:#ef4444; font-weight: 600; }
    .seg-original { color:#ef4444; }
    .seg-suggest { color:#1d4ed8; }
    .seg-reason { color:#10b981; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    @media print { body { background: #fff; } .page { max-width: unset; margin: 0; padding: 0; } .header { border-radius: 0; } .card { box-shadow: none; border-radius: 0; } .actions { display: none; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="title" id="title"></div>
      <div class="meta">
        <div class="meta-item">文体：<span id="genre"></span></div>
        <div class="meta-item">学生：<span id="studentName"></span></div>
        <div class="meta-item">时间：<span id="createdAt"></span></div>
      </div>
      <div class="actions">
        <button class="btn" onclick="window.print()">打印/导出PDF</button>
        <button class="btn" onclick="downloadHTML()">下载HTML</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>作文原文</h3>
        <div class="card-body">
          <div class="orig" id="recognizedText"></div>
        </div>
      </div>

      <div class="card">
        <h3>批改结果</h3>
        <div class="card-body">
          <div class="score"><div class="score-number" id="totalScore"></div><div class="score-badge">分</div></div>
          <div id="radar" class="chart"></div>
          <div class="dims" id="dims"></div>
        </div>
      </div>

      <div class="card">
        <h3>综合评价与修改建议</h3>
        <div class="card-body">
          <div class="section">
            <h4>综合评价</h4>
            <div class="overall" id="overallComment"></div>
          </div>
          <div class="section">
            <h4>修改建议</h4>
            <ul class="suggest" id="suggest"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const RAW = {"作文题目":"童年的发现 —— 眼泪的味道","文体":"小学记叙文","作者姓名":"王予夏","原文":"童年的发现 \n----------- 眼泪的味道 \n 小时候，幼稚又天真的我发现了眼泪是咸的。\n 为了看眼泪是什么味道，我还特意在我哭的时候尝了一下眼泪。为什么我会突然想看眼泪是什么味道呢？也许你会问这个问题吧！那我就告诉你吧！\n 记得有一天，我去书城去看书。我看了一本作文书上写的，内容是这样的：作者因为有一天生病不能上学，但又怕学习跟不上。突然，他灵机一动，他想到家里的电脑可以教他。其中在电脑上有一到题目，就是叫他用 “甜甜的” 来造句。他写他高兴得流下了甜甜的眼泪。电脑上显示了叫他尝尝他自己的眼泪是不是甜的这句话。我看完后，就把这篇文章深深的记了起来。\n 回到家，我就跑到房间里哭。但我怎么也哭不出来。可以看出，我是那么的想知道眼泪是不是甜的。为此我还故意做了许多的傻事，好让爸爸妈妈骂我。终于一个大巴掌打了过来。我立即跑进房间，我哭笑起来。我笑是因为我巧妙的办法让我成功的哭了。不知是怎么了，好像是爸爸妈妈打的太重了。所以，我的脸上火辣辣的。情不自禁的一颗颗金豆豆从我眼睛里掉了下来。我忙用手接住它们说：“别掉了，你们是我好辛苦的来的。不可以掉。” 于是我用舌头尝了尝。“哎呀，眼泪不是甜的，是咸的。” 我生气地说。枉我还费尽心思，没想到它竟然是咸的。\n 直到现在，我想这件事起来就会笑得前赴后仰。如果你也想笑，你就笑吧！不过，你的笑声可别让我听到。\n 从这里我明白了世界上的事都需要自己去亲身体验，才会了解。","总分":26,"六个维度评分及理由":[{"维度":"内容立意","得分":5,"理由":"完全扣题，题目核心关键词为 “童年”“发现”“眼泪的味道”，作文全程围绕童年尝试探索眼泪味道展开；核心事件清晰明确，完整呈现 “我” 因作文书内容启发，故意犯错让父母批评以流泪，最终尝出眼泪是咸味的全过程，且事件具有 “主动探索未知” 的核心亮点，符合 5 分评分标准。"},{"维度":"结构框架","得分":5,"理由":"作文共 6 段，远超至少 3 段的要求，包含开头引入发现、中间详写探索过程、结尾升华感悟的完整结构；过渡自然，使用了 “记得有一天”“回到家”“直到现在” 等过渡表述，中间段落详细描写尝试流泪、尝眼泪的核心事件，主次分明，符合 5 分评分标准。"},{"维度":"素材运用","得分":5,"理由":"素材源于生活常见场景，书城看书、家庭中与父母的互动都是小学生熟悉的日常场景，真实性强；细节描写丰富，包含动作描写 “忙用手接住它们”“用舌头尝了尝”，感受描写 “脸上火辣辣的”，比喻描写 “一颗颗金豆豆从我眼睛里掉了下来”，超过 2 个细节，符合 5 分评分标准。"},{"维度":"语言表达","得分":3,"理由":"病句数量较少，每 100 字不超过 3 句，仅存在 “我去书城去看书”“深深的记了起来”“好辛苦的来的” 等少量用词不当问题，无严重病句；使用了 1 处简单修辞，将眼泪比作 “金豆豆”，符合 3 分评分标准（因未达到 2 处以上修辞，未获 5 分）。"},{"维度":"情感表达","得分":5,"理由":"情感词丰富，出现 “高兴”“生气”“笑” 等直接情感词；情感与事件高度匹配，因成功流泪而 “笑”，因眼泪不是甜味而 “生气”，因回忆往事而觉得好笑，且明确说明了情感产生的原因，如 “我笑是因为我巧妙的办法让我成功的哭了”，符合 5 分评分标准。"},{"维度":"规范书写","得分":3,"理由":"错别字较少，每 100 字不超过 3 个，仅存在 “的”“地” 使用错误（“深深的记了起来”“好辛苦的来的”）等问题；格式基本正确，标题明确，段落划分清晰，标点使用无明显错误，但未完全做到段落首行缩进 2 字符，符合 3 分评分标准。"}],"综合评价":"这是一篇充满童真童趣的优秀记叙文！你以细腻的笔触记录了童年时期一次可爱的探索经历，事件完整生动，细节描写让人仿佛身临其境，结尾还提炼出 “亲身体验才懂真相” 的深刻感悟，展现了你的观察力和思考力。文中把眼泪比作 “金豆豆” 的表达十分巧妙，充满了小学生的天真烂漫，整体读起来亲切又有趣，继续加油，你一定能写出更多精彩的作文！","修改建议":["修改用词不当的语句，将 “我去书城去看书” 改为 “我去书城看书”，“深深的记了起来” 改为 “深深地记了下来”，“好辛苦的来的” 改为 “好不容易得来的”，“一到题目” 改为 “一道题目”。","增加一处修辞描写，让语言更生动，比如在 “故意做了许多的傻事” 后补充 “像故意打翻水杯、装作忘记写作业”，或在 “脸上火辣辣的” 后添加 “像贴了一块滚烫的小烧饼”。","规范格式，确保每个段落首行缩进 2 个字符，让文章排版更整洁。","可在 “故意做了许多的傻事” 处补充 1 - 2 件具体的傻事，比如 “我故意把饭碗打翻在地上，还偷偷藏起爸爸的眼镜”，让事件过程更丰满。","将 “我哭笑起来” 细化为 “我忍不住又哭又笑”，使表达更准确，贴合当时既疼又开心的复杂心情。"] };
    const DATA = {
      title: RAW['作文题目'],
      genre: RAW['文体'],
      studentName: RAW['作者姓名'],
      createdAt: new Date().toLocaleString('zh-CN', { hour12: false }),
      recognizedText: RAW['原文'],
      totalScore: RAW['总分'],
      dimensions: RAW['六个维度评分及理由'].map(x => ({ name: x['维度'], score: x['得分'], reason: x['理由'] })),
      overallComment: RAW['综合评价'],
      suggestions: RAW['修改建议']
    };
    window.DATA = DATA;
    function downloadHTML(){ const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${DATA.studentName}-${DATA.title}.html`; a.click(); }
    function fillHeader(){ document.getElementById('title').textContent = DATA.title; document.getElementById('genre').textContent = DATA.genre; document.getElementById('studentName').textContent = DATA.studentName; document.getElementById('createdAt').textContent = DATA.createdAt; }
    function fillOrig(){
      const el = document.getElementById('recognizedText'); el.innerHTML = '';
      const lines = (DATA.recognizedText || '').split(/\r?\n/).map(l => l.trim());
      const nonEmpty = lines.filter(l => l.length > 0);
      let titleLine = '';
      let subLine = '';
      if (nonEmpty.length) {
        titleLine = nonEmpty.find(l => !/^——\s*/.test(l)) || nonEmpty[0];
        const foundSubtitle = nonEmpty.find(l => /^——\s*/.test(l));
        if (foundSubtitle) {
          subLine = foundSubtitle;
        } else {
          const hy = nonEmpty.find(l => /^-+\s*/.test(l));
          if (hy) subLine = '—— ' + hy.replace(/^-+\s*/, '');
        }
      }
      if (titleLine) { const main = document.createElement('div'); main.className = 'title-main'; main.textContent = titleLine; el.appendChild(main); }
      if (subLine) { const sub = document.createElement('div'); sub.className = 'title-sub'; sub.textContent = subLine; el.appendChild(sub); }
      const bodyStart = (() => {
        if (!nonEmpty.length) return 0;
        const idxTitle = nonEmpty.indexOf(titleLine);
        const idxSub = subLine ? nonEmpty.indexOf(subLine) : -1;
        const start = Math.max(idxTitle, idxSub);
        return start >= 0 ? start + 1 : 1;
      })();
      for (let i = bodyStart; i < nonEmpty.length; i++) {
        const p = document.createElement('p'); p.innerHTML = annotateText(nonEmpty[i]); el.appendChild(p);
      }
      document.getElementById('totalScore').textContent = DATA.totalScore;
    }
    function fillOverall(){ document.getElementById('overallComment').textContent = DATA.overallComment || ''; }
    const PALE = ['#fff7ed','#f0fdf4','#f5f3ff','#eef2ff','#fff1f2','#fef9c3'];
    const PALE_BORDER = ['#fde68a','#bbf7d0','#ddd6fe','#dbeafe','#fecdd3','#fde68a'];
    function fillDims(){ const container = document.getElementById('dims'); container.innerHTML = ''; DATA.dimensions.forEach((d,i) => { const item = document.createElement('div'); item.className='dim-item'; const hd = document.createElement('div'); hd.className='dim-hd'; const left = document.createElement('span'); left.textContent = d.name; const right = document.createElement('span'); right.className='dim-score'; right.textContent = d.score; hd.appendChild(left); hd.appendChild(right); const reason = document.createElement('div'); reason.className='dim-reason'; reason.textContent = d.reason; reason.style.backgroundColor = PALE[i % PALE.length]; reason.style.borderLeftColor = PALE_BORDER[i % PALE_BORDER.length]; reason.style.borderColor = PALE_BORDER[i % PALE_BORDER.length]; item.appendChild(hd); item.appendChild(reason); container.appendChild(item); }); }
    function fillSuggest(){ const box = document.getElementById('suggest'); box.innerHTML=''; DATA.suggestions.forEach(s => { const li=document.createElement('li'); li.innerHTML = formatSuggestion(s); box.appendChild(li); }); }
    function renderRadar(){
      const dom = document.getElementById('radar'); const chart = echarts.init(dom);
      const maxScore = Math.max(5, ...DATA.dimensions.map(d => d.score));
      const indicators = DATA.dimensions.map(d => ({ name: d.name, max: maxScore }));
      const values = DATA.dimensions.map(d => d.score);
      const textColors = ['#ef4444','#10b981','#6366f1','#0ea5e9','#f59e0b','#ec4899'];
      const rich = {};
      const nameToStyle = new Map();
      DATA.dimensions.forEach((d,i) => {
        const key = `c${i}`;
        nameToStyle.set(d.name, key);
        rich[key] = {
          color: textColors[i % textColors.length],
          fontSize: 16,
          fontWeight: '700',
          fontFamily: 'Microsoft YaHei, 微软雅黑, Noto Sans SC, system-ui'
        };
      });
      chart.setOption({
        tooltip: { show: false },
        radar: {
          indicator: indicators,
          splitNumber: 5,
          name: {
            formatter: function (name) { const k = nameToStyle.get(name) || 'c0'; return `{${k}|${name}}`; },
            rich: rich,
            textStyle: { fontSize: 16 }
          },
          nameGap: 18,
          splitLine: { lineStyle: { color: ['#e5e7eb'] } },
          splitArea: { areaStyle: { color: ['#fafafa','#fff'] } }
        },
        series: [{
          type: 'radar',
          label: { show: true, position: 'inside', distance: 10, fontSize: 22, fontWeight: '700', color: '#111827', fontFamily: 'Microsoft YaHei, 微软雅黑, Noto Sans SC, system-ui' },
          data: [{ value: values, areaStyle: { color: 'rgba(79,70,229,.25)' }, lineStyle: { color: '#ef4444', width: 2 }, symbol: 'circle', symbolSize: 3 }]
        }]
      });
    }
    function escapeHtml(str){ return String(str).replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s])); }
    function annotateText(line){ let h = escapeHtml(line); h = h.replace(/\[([^\]]+)\]/g, '<span class="mark-wrong">$1</span>'); h = h.replace(/\{([^}]+)\}/g, '<span class="mark-good">$1</span>'); h = h.replace(/@@([^@]+)@@/g, '<span class="mark-bad">$1</span>'); h = h.replace(/@([^@]+)@/g, '<span class="mark-bad">$1</span>'); return h; }
    function formatSuggestion(s){ const text = String(s); const parts = []; const re = /【(原文|修改建议|理由)】([\s\S]*?)(?=【|$)/g; let m; let any=false; while ((m = re.exec(text))){ any=true; const label=m[1]; const content=escapeHtml(m[2].trim()); if (label==='原文') parts.push(`<span class="seg-original">【原文】${content}</span>`); else if (label==='修改建议') parts.push(`<span class="seg-suggest">【修改建议】${content}</span>`); else parts.push(`<span class="seg-reason">【理由】${content}</span>`); } if (!any) return escapeHtml(text); return parts.join('<br>'); }
    fillHeader(); fillOrig(); fillOverall(); fillDims(); fillSuggest(); renderRadar();
  </script>
</body>
</html>
