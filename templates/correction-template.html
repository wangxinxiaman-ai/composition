<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>作文批改结果</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Use local echarts for reliability -->
  <script src="/public/js/echarts.min.js"></script>
  <style>
    :root { --bg:#f7f8fa; --card:#ffffff; --text:#1f2d3d; --muted:#6b7280; --accent:#4f46e5; --accent-2:#14b8a6; --accent-3:#ef4444; --border:#e5e7eb; --good:#10b981; --warn:#f59e0b; }
    html,body { background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', system-ui, -apple-system, 'Segoe UI', Roboto; }
    .page { max-width: 1440px; margin: 24px auto; padding: 0 16px; }
    .header { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(79,70,229,.2); }
    .title { font-size: 28px; font-weight: 700; letter-spacing: .5px; }
    .meta { margin-top: 8px; display:flex; gap:16px; flex-wrap:wrap; }
    .meta-item { background: rgba(255,255,255,.15); padding: 6px 10px; border-radius: 999px; font-size: 13px; }
    .actions { display:flex; gap:10px; margin-top: 14px; }
    .btn { appearance:none; border:1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.15); color:#fff; border-radius: 999px; padding:10px 14px; font-size:14px; cursor:pointer; }
    .btn:hover { background: rgba(255,255,255,.25); }
    
    /* 2列布局 */
    .grid { display:grid; grid-template-columns: 3fr 2fr; gap: 24px; margin-top: 20px; }
    
    .card { background: var(--card); border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.06); border:1px solid var(--border); display: flex; flex-direction: column; break-inside: avoid; overflow: hidden; }
    .card h3 { margin: 0; padding: 16px 20px; font-size: 18px; border-bottom:1px solid var(--border); }
    .card-body { padding: 18px 20px; flex: 1; }
    
    /* 左侧原文样式 */
    .orig { line-height: 2.2; font-size: 18px; font-family: 'Noto Serif SC', serif; white-space: pre-wrap; }
    .orig .title-main { text-align: center; font-size: 24px; font-weight: 700; margin: 10px 0 16px; }
    .orig .title-sub { text-align: center; font-size: 18px; color: var(--muted); margin: 0 0 16px; }
    .orig p { margin: 0 0 16px; text-indent: 2em; }
    
    /* 标记样式 */
    /* 错别字：红圈 + 绿色正确字 */
    .mark-wrong { border: 2px solid #ef4444; border-radius: 50%; padding: 2px 4px; color: #ef4444; font-weight: 500; margin: 0 2px; }
    .mark-wrong-correct { color: #10b981; font-weight: 700; font-size: 0.9em; margin-right: 2px; }
    
    /* 好句子：绿色波浪线 + 绿色理由 */
    .mark-good { text-decoration: underline; text-decoration-style: wavy; text-decoration-color: #10b981; text-decoration-thickness: 2px; text-underline-offset: 6px; color: inherit; }
    .mark-good-reason { color: #10b981; font-size: 0.9em; font-weight: 500; margin-left: 4px; }
    
    /* 不好句子：红色波浪线 + 红色问题 + 蓝色建议 */
    .mark-bad { text-decoration: underline; text-decoration-style: wavy; text-decoration-color: #ef4444; text-decoration-thickness: 2px; text-underline-offset: 6px; color: inherit; }
    .mark-bad-reason { color: #ef4444; font-size: 0.9em; font-weight: 500; margin-left: 4px; }
    .mark-bad-suggest { color: #2563eb; font-size: 0.9em; font-weight: 500; margin-left: 4px; }

    /* 右侧布局 */
    .right-panel { display: flex; flex-direction: column; gap: 20px; }
    .score-box { display: none; }
    
    .chart { width: 100%; height: 320px; margin-bottom: 0; }
    
    .dims { display:grid; grid-template-columns: 1fr; gap: 12px; }
    .dim-item { border:1px solid var(--border); border-radius: 12px; padding: 12px; overflow: hidden; background: #fafafa; }
    .dim-hd { display:flex; justify-content: space-between; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .dim-score { color: var(--accent); background: #e0e7ff; padding: 2px 8px; border-radius: 6px; font-size: 14px; }
    .dim-reason { color: #4b5563; font-size: 15px; line-height: 1.7; }
    
    .section { margin-top: 10px; }
    .section h4 { margin: 0 0 10px; font-size: 16px; color: var(--text); border-left: 4px solid var(--accent); padding-left: 10px; }
    .overall { background: #fdf4ff; border: 1px solid #f0abfc; border-radius: 12px; padding: 20px; color: #0044cc; line-height: 1.8; font-size: 16px; }
    
    /* ===== 日志面板样式（与home.html完全一致）===== */
    #debug-log-panel {
        position: fixed;
        bottom: 0;
        right: 0;
        width: 100%;
        max-width: 600px;
        height: 300px;
        background: rgba(0, 0, 0, 0.85);
        color: #0f0;
        font-family: monospace;
        font-size: 12px;
        padding: 10px;
        overflow-y: auto;
        z-index: 9999;
        display: none;
        border-top-left-radius: 8px;
        box-shadow: -2px -2px 10px rgba(0,0,0,0.2);
    }
    #debug-log-panel .log-entry { border-bottom: 1px solid #333; padding: 2px 0; }
    #debug-log-panel .log-time { color: #888; margin-right: 8px; }
    #debug-log-panel .log-error { color: #ff5555; }
    #debug-log-panel .log-heartbeat { color: #55ffff; }
    
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
    @media print {
      body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .page { max-width: 100%; margin: 0; padding: 0 20px; }
      .header, .actions, #studentNav { display: none !important; }
      
      .grid { display: block; }
      .right-panel { display: block; width: 100%; gap: 0; }
      
      .card { 
          display: block;
          box-shadow: none; 
          border: none; 
          margin-bottom: 0; 
          break-inside: auto; 
          overflow: visible;
      }
      
      /* Explicitly set padding to ensure separation from H3 border */
      .card-body { padding: 10px 0 0 0; }
      
      /* Add specific spacing for the first card in the right panel */
      .right-panel .card:first-child { 
          margin-top: 30px; 
      }
      
      /* Force background colors */
      .dim-item, .overall, .dim-score { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      
      /* Radar adjustments */
      .chart { 
          width: 100% !important; 
          height: 280px; 
          margin: 10px auto 0; /* Top 10px, Bottom 0 to ensure dims follow immediately */
          display: flex; justify-content: center; align-items: center; 
          break-inside: avoid; page-break-inside: avoid; /* Prevent chart splitting */
          overflow: visible; /* Ensure labels are not clipped */
      }
      
      /* Hide specific non-printable elements */
      .meta { margin-top: 0 !important; margin-bottom: 10px; }
      
      /* Layout flow */
      .section { 
          break-inside: auto; /* Allow dims to break if needed */
          margin-top: 10px; /* Consistent gap after chart */
          margin-bottom: 15px; 
          display: block; 
      }
      .dims { display: block; margin-bottom: 15px; width: 100%; } 
      .dim-item { break-inside: avoid; page-break-inside: avoid; margin-bottom: 10px; display: block; }
      
      /* Overall section separation */
      .overall { margin-top: 10px; break-inside: avoid; page-break-inside: avoid; display: block; }
      
      /* Ensure Right Panel flows correctly */
      .right-panel .card { margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="title" id="hdrTitle"></div>
      
      <!-- 学生切换导航栏 (批量模式下显示) -->
      <div id="studentNav" style="display:none; margin-top:16px; gap:10px; flex-wrap:wrap;"></div>
      
      <div class="meta" style="margin-top:16px;">
        <div class="meta-item">文体：<span id="hdrGenre"></span></div>
        <div class="meta-item" style="display:none;">学生：<span id="hdrStudent"></span></div>
        <div class="meta-item">时间：<span id="hdrTime"></span></div>
      </div>
      <div class="actions">
        <button class="btn" onclick="window.print()">打印/导出PDF</button>
      </div>
    </div>

    <div class="grid">
      <!-- 左侧：原文与批注 -->
      <div class="card">
        <h3>原文与批注</h3>
        <div class="card-body">
          <div class="orig" id="recognizedText"></div>
        </div>
      </div>

      <!-- 右侧：评分与分析 -->
      <div class="right-panel">
        <div class="card">
          <h3>评分分析</h3>
          <div class="card-body">
            <div id="radar" class="chart"></div>
            <div class="section" style="margin-top:0;">
                <h4 style="margin-bottom:12px;">维度得分详情</h4>
                <div class="dims" id="dims"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>综合评价</h3>
          <div class="card-body">
            <div class="overall" id="overallComment"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 日志面板（必须在script之前，确保getElementById能找到）-->
  <div id="debug-log-panel"></div>

  <script>
    let BATCH_DATA = [];
    let DATA = {};
    let chartInstance = null;

    // ========================================
    // IndexedDB Storage Adapter (same as home.html)
    // ========================================
    const CorrectionDB = {
        dbName: 'CorrectionDB',
        storeName: 'corrections',
        version: 1,
        
        async openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(this.dbName, this.version);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(this.storeName)) {
                        db.createObjectStore(this.storeName, { keyPath: 'id' });
                    }
                };
            });
        },
        
        async get() {
            try {
                const db = await this.openDB();
                const transaction = db.transaction([this.storeName], 'readonly');
                const store = transaction.objectStore(this.storeName);
                
                return new Promise((resolve, reject) => {
                    const request = store.get('batchCorrectionData');
                    request.onsuccess = () => {
                        const result = request.result;
                        resolve(result ? result.data : null);
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error('IndexedDB get error:', error);
                return null;
            }
        }
    };

    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        
        if (mode === 'batch') {
            // ✅ Try IndexedDB first, fallback to localStorage
            logDebug('开始加载批改数据...', 'info');
            try {
                const data = await CorrectionDB.get();
                logDebug(`IndexedDB原始数据: ${JSON.stringify(data).substring(0, 100)}...`, 'info');
                logDebug(`数据类型: ${typeof data}, 是否为数组: ${Array.isArray(data)}`, 'info');
                
                if (data && Array.isArray(data) && data.length > 0) {
                    BATCH_DATA = data;
                    logDebug(`✅ 从 IndexedDB 读取 ${BATCH_DATA.length} 个批改结果`, 'success');
                    logDebug(`BATCH_DATA详情: ${JSON.stringify(BATCH_DATA.map((item, idx) => ({
                        idx: idx+1,
                        name: item.studentName || item['作者姓名'] || `学生${idx+1}`,
                        hasTitle: !!item['作文题目'],
                        hasText: !!item['原文'],
                        hasScore: !!item['总分']
                    })))}`, 'info');
                } else {
                    logDebug('⚠️ IndexedDB数据为空或格式错误，尝试localStorage', 'warn');
                    // Fallback to localStorage
                    const s = localStorage.getItem('batchCorrectionData');
                    if (s) {
                        BATCH_DATA = JSON.parse(s);
                        logDebug(`⚠️ Fallback: 从 localStorage 读取 ${BATCH_DATA.length} 个结果`, 'warn');
                        logDebug(`localStorage数据: ${JSON.stringify(BATCH_DATA.map((item, idx) => ({
                            idx: idx+1,
                            name: item.studentName || item['作者姓名'] || `学生${idx+1}`
                        })))}`, 'info');
                    }
                }
            } catch(e) {
                logDebug(`❌ 读取数据失败: ${e.message}`, 'error');
                // Final fallback to localStorage
                try {
                    const s = localStorage.getItem('batchCorrectionData');
                    if (s) {
                        BATCH_DATA = JSON.parse(s);
                        logDebug(`⚠️ 异常恢复: 从 localStorage 读取 ${BATCH_DATA.length} 个结果`, 'warn');
                    }
                } catch(e2) { 
                    logDebug(`❌ localStorage也失败了: ${e2.message}`, 'error'); 
                }
            }
            
            logDebug(`🎯 最终 BATCH_DATA.length = ${BATCH_DATA.length}`, 'info');
            
            if (BATCH_DATA.length > 0) {
                logDebug('📝 开始渲染导航栏...', 'info');
                renderNav();
                logDebug('📄 加载第一个学生数据...', 'info');
                loadData(BATCH_DATA[0]);
            } else {
                logDebug('❌ 没有找到任何批改数据', 'error');
                alert('未找到批量批改数据\n\n请检查:\n1. 是否已完成批改\n2. 浏览器控制台是否有错误信息\n3. IndexedDB和localStorage是否被清空');
            }
        } else {
            // Single mode
            logDebug('📄 单个学生模式，从localStorage读取数据', 'info');
            try {
                const s = localStorage.getItem('correctionData');
                if (s) {
                    logDebug('✅ 成功读取单个学生数据', 'success');
                    loadData(JSON.parse(s));
                } else {
                    logDebug('⚠️ localStorage中没有数据', 'warn');
                }
            } catch(e) { 
                logDebug(`❌ 单个学生数据加载失败: ${e.message}`, 'error');
            }
        }
    }

    function loadData(j) {
        logDebug(`📥 loadData 被调用，数据: ${JSON.stringify(j).substring(0, 100)}...`, 'info');
        
        if (!j) {
            logDebug('❌ loadData 收到空数据', 'error');
            return;
        }
        
        // 解析维度评分
        const dimsCn = (j['五个维度评分及理由']||j['六个维度评分及理由']||[]).map(x => ({ 
            name: x['维度'], 
            score: x['得分'], 
            reason: x['理由'] 
        }));
        const dimsFiltered = dimsCn.filter(d => d.name !== '规范书写');
        
        logDebug(`📊 解析到 ${dimsFiltered.length} 个维度: ${dimsFiltered.map(d => d.name).join(', ')}`, 'info');
        
        DATA = {
            title: j['作文题目']||j['title']||'',
            genre: j['文体']||j['genre']||'',
            studentName: j['作者姓名']||j['studentName']||'',
            createdAt: new Date().toLocaleString('zh-CN', { hour12: false }),
            recognizedText: j['原文']||j['raw_text']||j['recognizedText']||'',
            totalScore: j['总分']||j['totalScore']||0,
            dimensions: dimsFiltered,
            overallComment: j['综合评价']||j['overallComment']||'',
        };
        
        logDebug(`✅ DATA 对象构建完成: {title: "${DATA.title}", studentName: "${DATA.studentName}", totalScore: ${DATA.totalScore}, dimensionCount: ${DATA.dimensions.length}, hasText: ${!!DATA.recognizedText}}`, 'success');
        
        refreshView();
        logDebug('✅ 视图刷新完成', 'success');
    }
    
    function renderNav() {
        const nav = document.getElementById('studentNav');
        nav.style.display = 'flex';
        nav.innerHTML = '';
        
        logDebug(`🎨 开始渲染导航栏，BATCH_DATA.length = ${BATCH_DATA.length}`, 'info');
        
        if (!Array.isArray(BATCH_DATA)) {
            logDebug(`❌ BATCH_DATA 不是数组！类型: ${typeof BATCH_DATA}`, 'error');
            return;
        }
        
        BATCH_DATA.forEach((item, idx) => {
            const btn = document.createElement('button');
            const sName = item.studentName || item['作者姓名'] || `学生${idx+1}`;
            logDebug(`➕ 创建按钮 ${idx+1}: ${sName}, 数据完整性: {title: ${!!item['作文题目']}, text: ${!!item['原文']}, score: ${!!item['总分']}}`, 'info');
            
            btn.textContent = sName;
            btn.className = 'btn';
            btn.style.cssText = 'font-size:13px; padding:6px 12px; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4);';
            
            btn.onclick = () => {
                logDebug(`👆 点击切换到学生: ${sName}`, 'info');
                // Update active state
                Array.from(nav.children).forEach(b => b.style.background = 'rgba(255,255,255,0.2)');
                btn.style.background = 'rgba(255,255,255,0.5)';
                loadData(item);
            };
            
            if (idx === 0) {
                btn.style.background = 'rgba(255,255,255,0.5)';
                logDebug(`✅ 按钮 ${sName} 设置为激活状态`, 'success');
            }
            nav.appendChild(btn);
        });
        
        logDebug(`✅ 导航栏渲染完成，共创建 ${nav.children.length} 个按钮`, 'success');
    }

    function refreshView() {
        fillHeader();
        fillOrig();
        fillDims();
        renderRadar();
    }
    
    function fillHeader(){
      const title = (DATA.title && DATA.title.trim()) || '作文批改结果';
      const genre = (DATA.genre && DATA.genre.trim()) || (localStorage.getItem('selectedStandard')||'未提供');
      const student = (DATA.studentName||'未提供');
      const when = new Date().toLocaleString('zh-CN', { hour12: false });
      
      document.getElementById('hdrTitle').textContent = title;
      document.getElementById('hdrGenre').textContent = genre;
      document.getElementById('hdrStudent').textContent = student;
      document.getElementById('hdrTime').textContent = when;
      
      document.getElementById('overallComment').textContent = DATA.overallComment || '暂无评价';
    }

    function escapeHtml(str){ return String(str).replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s])); }

    function annotateText(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      
      // 1. 解析不好的句子 @句子_问题_建议@
      // 必须支持句子中包含 [错别字_正字] 的情况，即句子中可能含有下划线
      // 采用从后向前查找分隔符的策略
      html = html.replace(/@([^@]+)@/g, (match, content) => {
         // 如果内容以 _ 结尾，则去除该下划线
         if (content.endsWith('_')) {
            content = content.slice(0, -1);
         }
         
         // 寻找最后一个 _ 作为建议的分隔
         const lastUnderscore = content.lastIndexOf('_');
         
         // 兼容处理：如果没有找到 _，说明可能是格式错误，或者就是一整段话
         // 在这种情况下，直接去除 @ 符号，不加任何样式，作为普通文本显示
         if (lastUnderscore === -1) {
             return content;
         }
         
         const suggestion = content.substring(lastUnderscore + 1);
         const rest = content.substring(0, lastUnderscore);
         
         // 寻找倒数第二个 _ 作为问题的分隔
         const secondLastUnderscore = rest.lastIndexOf('_');
         
         // 兼容处理：如果只找到一个 _，说明只有“句子_建议”或“句子_问题”，没有分成三段
         // 这种情况下，我们假设是“句子_问题/建议”
         if (secondLastUnderscore === -1) {
             return `<span class="mark-bad">${rest}</span><span class="mark-bad-reason">（${suggestion}）</span>`;
         }
         
         const problem = rest.substring(secondLastUnderscore + 1);
         const sentence = rest.substring(0, secondLastUnderscore);
         
         return `<span class="mark-bad">${sentence}</span><span class="mark-bad-reason">（问题：${problem}）</span><span class="mark-bad-suggest">（建议：${suggestion}）</span>`;
      });

      // 2. 解析好的句子 【句子_好在哪里】
      html = html.replace(/【([^】]+)】/g, (match, content) => {
        // 如果内容以 _ 结尾，则去除该下划线
        if (content.endsWith('_')) {
           content = content.slice(0, -1);
        }
        
        const lastSep = content.lastIndexOf('_'); 
        if (lastSep === -1) return match;
        
        const sentence = content.substring(0, lastSep);
        const reason = content.substring(lastSep + 1);
        
        return `<span class="mark-good">${sentence}</span><span class="mark-good-reason">（${reason}）</span>`;
      });

      // 3. 解析错别字 [错字_正字] 或 [错字（正字）]
      // 兼容中文括号和英文括号，以及省略右括号的情况
      html = html.replace(/\[([^\]_（(]+)[_（(]([^\]_）)]+)[）)]?\]/g, (match, wrong, correct) => {
        return `<span class="mark-wrong">${wrong}</span><span class="mark-wrong-correct">(${correct})</span>`;
      });

      // 4. 清理剩余的孤立 @ 符号
      // 这些 @ 可能是因为格式错误导致没有被第一步匹配到，或者是多余的符号
      html = html.replace(/@/g, '');

      return html;
    }

    function fillOrig(){
      const el = document.getElementById('recognizedText'); if (!el) return;
      el.innerHTML = '';
      const lines = (DATA.recognizedText || '').split(/\r?\n/).map(l => l.trim());
      const nonEmpty = lines.filter(l => l.length > 0);
      
      // 尝试识别标题
      let titleLine = '';
      if (nonEmpty.length && nonEmpty[0].length < 30 && !nonEmpty[0].includes('。')) {
          titleLine = nonEmpty[0];
      }
      
      let startIdx = 0;
      if (titleLine) {
         const main = document.createElement('div'); main.className = 'title-main'; main.textContent = titleLine; el.appendChild(main);
         startIdx = lines.indexOf(titleLine) + 1;
      }
      
      for (let i = startIdx; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const p = document.createElement('p'); 
        p.innerHTML = annotateText(line); 
        el.appendChild(p);
      }
    }

    function fillDims(){
      const container = document.getElementById('dims');
      container.innerHTML = '';
      const textColors = ['#ef4444','#10b981','#6366f1','#0ea5e9','#f59e0b','#ec4899'];
      
      DATA.dimensions.forEach((d, idx) => {
        const color = textColors[idx % textColors.length];
        const item = document.createElement('div'); item.className='dim-item';
        
        // 设置淡色背景：利用 hex 转 rgba，透明度 0.08
        // 简单处理：将 hex 转换为 rgba
        let r=0,g=0,b=0;
        if(color.length === 7) {
            r = parseInt(color.slice(1,3), 16);
            g = parseInt(color.slice(3,5), 16);
            b = parseInt(color.slice(5,7), 16);
        }
        item.style.backgroundColor = `rgba(${r},${g},${b},0.06)`;
        item.style.borderColor = `rgba(${r},${g},${b},0.2)`;

        const hd = document.createElement('div'); hd.className='dim-hd';
        const left = document.createElement('span'); left.textContent = d.name;
        left.style.color = color; // 标题也用该颜色

        const right = document.createElement('span'); right.className='dim-score'; right.textContent = d.score + '分';
        // right.style.color = color; // 分数颜色保持默认 accent 或者也用该颜色？保持默认较清晰，或者统一
        right.style.backgroundColor = `rgba(${r},${g},${b},0.15)`; // 分数背景也跟随
        right.style.color = color;

        hd.appendChild(left); hd.appendChild(right);
        const reason = document.createElement('div'); reason.className='dim-reason'; reason.textContent = d.reason;
        item.appendChild(hd); item.appendChild(reason); container.appendChild(item);
      });
    }

    function renderRadar(){
      const dom = document.getElementById('radar'); 
      if (!dom || !DATA.dimensions.length) return;
      
      // In export mode, radar div contains an img. Do not re-render echarts.
      if (dom.querySelector('img')) return;

      // Dispose old chart if exists
      if (chartInstance) {
          chartInstance.dispose();
      }
      chartInstance = echarts.init(dom);
      const chart = chartInstance;
      
      // 满分固定为 6
      const maxScore = 6;
      
      const chartData = DATA.dimensions.map(d => parseInt(d.score));
      const indicators = DATA.dimensions.map(d => ({ name: d.name, max: maxScore }));
      
      const textColors = ['#ef4444','#10b981','#6366f1','#0ea5e9','#f59e0b','#ec4899'];
      const rich = {};
      const nameToStyle = new Map();
      DATA.dimensions.forEach((d,i) => {
        const key = `c${i}`;
        nameToStyle.set(d.name, key);
        rich[key] = {
             color: textColors[i % textColors.length],
             fontSize: 18,
             fontWeight: '700',
             fontFamily: 'Microsoft YaHei, 微软雅黑, Noto Sans SC, system-ui'
           };
         });
         
         chart.setOption({
            title: {
                text: '{score|' + (DATA.totalScore||0) + '分}',
                left: 'center',
                top: 'center', // Strictly center
                textStyle: {
                    rich: {
                        score: {
                            color: '#d97706',
                            fontSize: 36,
                            lineHeight: 36,
                            fontWeight: 'bold',
                            textBorderColor: '#fff',
                            textBorderWidth: 3,
                            verticalAlign: 'middle'
                        }
                    }
                }
            },
            tooltip: { show: false }, // 移除鼠标互动
            radar: {
              center: ['50%', '50%'], // Strictly center
              radius: '60%', 
              nameGap: 15,
              indicator: indicators,
            splitNumber: 6, 
            name: {
              formatter: function (name) { 
                  const k = nameToStyle.get(name) || 'c0'; 
                  // 查找对应的分数
                  const dim = DATA.dimensions.find(d => d.name === name);
                  const score = dim ? dim.score : '';
                  return `{${k}|${name}}\n{score|${score}分}`; 
              },
              rich: {
                  ...rich,
                  score: {
                      color: '#6b7280',
                      fontSize: 17,
                      fontWeight: 'bold',
                      padding: [6, 0, 0, 0], // 增大间距
                      align: 'center'
                  }
              },
              textStyle: { fontSize: 18 }
            },
            nameGap: 18,
          splitLine: { lineStyle: { color: ['#e5e7eb'] } },
          splitArea: { areaStyle: { color: ['#fafafa','#fff'] } }
        },
        series: [{
          type: 'radar',
          data: [{
            value: chartData,
            // name: '维度得分', // 移除 tooltip 需要的 name
            areaStyle: { color: 'rgba(79, 70, 229, 0.25)' },
            lineStyle: { color: '#ef4444', width: 2 }, // 还原原来的红色线条
            symbol: 'circle',
            symbolSize: 3, // 还原原来的点大小
            itemStyle: { color: '#ef4444' }, // 还原原来的点颜色
            label: { show: false }
          }]
        }]
      });
      
      window.addEventListener('resize', () => chart.resize());
    }

    // ===== 日志系统（必须在init()之前定义）=====
    const debugPanel = document.getElementById('debug-log-panel');
    
    function logDebug(msg, type = 'info') {
        if (!debugPanel) {
            console.log(`[logDebug] ${msg}`);
            return;
        }
        const div = document.createElement('div');
        div.className = 'log-entry';
        const time = new Date().toLocaleTimeString() + '.' + String(new Date().getMilliseconds()).padStart(3, '0');
        const typeClass = type === 'error' ? 'log-error' : (type === 'heartbeat' ? 'log-heartbeat' : '');
        div.innerHTML = `<span class="log-time">[${time}]</span><span class="${typeClass}">${msg}</span>`;
        debugPanel.appendChild(div);
        debugPanel.scrollTop = debugPanel.scrollHeight;
        console.log(`[${time}] ${msg}`);
    }
    
    // 页面加载时自动显示日志面板
    if (debugPanel) {
        debugPanel.style.display = 'block';
        logDebug('🎬 结果页面已加载', 'info');
    }
    
    init();
  </script>
</body>
</html>
